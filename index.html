<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5A9E8F">
<title>考研错题复习</title>
<style>
:root {
  --pri: #5A9E8F; --pri-light: #EDF6F4; --pri-dark: #4A8A7C;
  --green: #4A8C5C; --green-bg: #EDF5EF;
  --blue: #3A7CA5; --blue-bg: #ECF3F8;
  --amber: #C48A2A; --amber-bg: #FDF5EA;
  --purple: #7B5EA7; --purple-bg: #F3EEF9;
  --red: #C47A7A; --red-bg: #F9F0F0;
  --gray: #7F8C8D; --gray-bg: #F0F2F2;
  --bg: #FAF7F2; --card: #fff; --text: #2D3436; --text2: #888; --text3: #BBB;
  --radius: 14px; --shadow: 0 2px 10px rgba(0,0,0,0.06);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  max-width: 500px; margin: 0 auto; padding-bottom: 90px;
  -webkit-font-smoothing: antialiased;
}
.header {
  background: linear-gradient(135deg, var(--pri) 0%, var(--pri-dark) 100%);
  color: #fff; padding: 22px 20px 16px; border-radius: 0 0 22px 22px;
  box-shadow: 0 4px 20px rgba(90,158,143,0.25);
}
.header h1 { font-size: 21px; font-weight: 700; letter-spacing: 0.5px; }
.header .sub { font-size: 12px; opacity: 0.8; margin-top: 3px; }
.stats { display: flex; gap: 8px; margin-top: 14px; }
.stat-box {
  flex: 1; background: rgba(255,255,255,0.18); border-radius: 12px;
  padding: 10px 0; text-align: center; backdrop-filter: blur(6px);
}
.stat-num { font-size: 22px; font-weight: 700; }
.stat-label { font-size: 10px; opacity: 0.85; margin-top: 2px; }
.tab-bar {
  display: flex; margin: 14px 16px 0; background: var(--card);
  border-radius: var(--radius); padding: 3px; box-shadow: var(--shadow);
}
.tab-btn {
  flex: 1; padding: 10px 0; border-radius: 11px; border: none;
  background: transparent; color: var(--text2); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: var(--pri); color: #fff; }
.content { padding: 10px 16px; }
.section-label {
  font-size: 12px; font-weight: 600; color: var(--text3);
  margin: 14px 0 8px 4px; display: flex; align-items: center; gap: 6px;
}
.card {
  background: var(--card); border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 10px; box-shadow: var(--shadow); transition: transform 0.12s;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.card-top { display: flex; align-items: center; gap: 8px; }
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600; flex-shrink: 0;
}
.problem-text { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.4; }
.date-text { font-size: 11px; color: var(--text3); white-space: nowrap; }
.error-type {
  display: inline-block; font-size: 11px; padding: 2px 8px;
  border-radius: 6px; margin-top: 6px; font-weight: 500;
}
.note-text { font-size: 12px; color: var(--text2); margin-top: 5px; line-height: 1.4; }
.review-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.review-dot {
  display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text3);
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot-done { background: var(--green); }
.dot-due { background: var(--pri); }
.dot-pending { background: #DDD; }
.dot-blocked { background: #EEE; }
.review-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
}
.badge-urgent { background: var(--pri-light); color: var(--pri); }
.badge-normal { background: var(--blue-bg); color: var(--blue); }
.btn {
  padding: 8px 16px; border-radius: 10px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.btn:active { opacity: 0.7; }
.btn-done { background: var(--green); color: #fff; }
.btn-fail { background: var(--red-bg); color: var(--red); }
.btn-action { background: #F5F3F0; color: var(--text2); font-size: 12px; padding: 6px 12px; }
.btn-danger { background: var(--pri-light); color: var(--pri); font-size: 12px; padding: 6px 12px; }
.btn-master { background: var(--green-bg); color: var(--green); font-size: 12px; padding: 6px 12px; }
.action-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.card-bottom {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; gap: 8px; flex-wrap: wrap;
}
.expanded { margin-top: 10px; padding-top: 10px; border-top: 1px solid #F0EDEA; }
.empty { text-align: center; padding: 44px 20px; color: var(--text3); }
.empty-icon { font-size: 38px; margin-bottom: 10px; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text2); }
.empty-sub { font-size: 12px; margin-top: 5px; }
.fab {
  position: fixed; bottom: 24px; right: 24px; width: 54px; height: 54px;
  border-radius: 50%; background: linear-gradient(135deg, var(--pri), var(--pri-dark));
  color: #fff; border: none; font-size: 28px; box-shadow: 0 4px 16px rgba(90,158,143,0.35);
  cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 50;
}
.fab:active { transform: scale(0.92); }
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal {
  width: 100%; max-width: 500px; background: var(--card);
  border-radius: 22px 22px 0 0; padding: 22px 20px 34px;
  max-height: 88vh; overflow-y: auto; animation: slideModal 0.25s ease;
}
@keyframes slideModal { from { transform:translateY(40px); } to { transform:translateY(0); } }
.modal-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
}
.modal-title { font-size: 17px; font-weight: 700; }
.modal-close {
  background: none; border: none; font-size: 20px; color: var(--text3);
  cursor: pointer; padding: 4px;
}
.form-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
.form-group { margin-bottom: 16px; }
.form-input {
  width: 100%; padding: 11px 14px; border-radius: 12px;
  border: 2px solid #EEE; font-size: 15px; outline: none;
  font-family: inherit; transition: border-color 0.2s; background: #FAFAFA;
}
.form-input:focus { border-color: var(--pri); background: #fff; }
.subject-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.subject-btn {
  padding: 6px 13px; border-radius: 20px; border: 2px solid #EEE;
  background: #FAFAFA; color: var(--text3); font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.subject-btn.active { border-color: currentColor; }
.error-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.error-btn {
  padding: 6px 12px; border-radius: 10px; border: 2px solid #EEE;
  background: #FAFAFA; color: var(--text2); font-size: 12px;
  font-weight: 500; cursor: pointer; transition: all 0.15s;
}
.error-btn.active { border-color: var(--pri); background: var(--pri-light); color: var(--pri); }
.submit-btn {
  width: 100%; padding: 14px; border-radius: var(--radius); border: none;
  background: linear-gradient(135deg, var(--pri), var(--pri-dark));
  color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
}
.submit-btn:active { opacity: 0.85; }
.preview-text { font-size: 11px; color: var(--text3); margin-top: 6px; }
.toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 22px; border-radius: 12px;
  font-size: 13px; font-weight: 600; z-index: 300; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: toastAnim 1.8s ease forwards;
}
@keyframes toastAnim {
  0% { opacity:0; transform:translateX(-50%) translateY(-8px); }
  12% { opacity:1; transform:translateX(-50%) translateY(0); }
  78% { opacity:1; transform:translateX(-50%) translateY(0); }
  100% { opacity:0; transform:translateX(-50%) translateY(-8px); }
}
.data-panel { padding: 16px; }
.data-btn {
  width: 100%; padding: 14px; border-radius: var(--radius); border: 2px solid #EEE;
  background: var(--card); font-size: 14px; font-weight: 600; cursor: pointer;
  margin-bottom: 10px; text-align: center; color: var(--text); transition: all 0.15s;
}
.data-btn:active { background: #F5F3F0; }
.data-btn.danger { border-color: var(--pri-light); color: var(--pri); }
.stage-bar { display:flex; gap:6px; margin:16px 16px 0; padding:4px; background:#EAEDE8; border-radius:14px; }
.stage-btn { flex:1; padding:11px 4px; border:0; border-radius:11px; background:transparent; color:var(--text2); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }
.stage-btn.active { background:var(--card); color:var(--pri-dark); box-shadow:var(--shadow); }
.stage-hint { margin:8px 20px 0; color:var(--text2); font-size:11px; line-height:1.7; }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════
   考研错题复习 v5 - Separate Foundation and Intensive Collections
   轮次间隔：3天 → 7天 → 15天（累计：+3, +10, +25）
   修复：按实际完成日顺延 · 安全迁移 · JSON 文件备份
   ═══════════════════════════════════════════════ */

const STORAGE_KEY = 'kaoyan_review_v4';
const OLD_STORAGE_KEY = 'kaoyan_review_v3';
const INTERVALS = [3, 10, 25];       // 累计天数（距录入日）
const INTER_GAPS = [3, 7, 15];       // 轮次间隔
const INTERVAL_LABELS = ['3天后', '10天后', '25天后'];

const STAGES = [
  { id:'foundation', name:'基础阶段' },
  { id:'intensive', name:'强化阶段' },
];
const stageOf = p => STAGES.some(s => s.id === p.stage) ? p.stage : 'foundation';
const stageName = id => STAGES.find(s => s.id === id)?.name || '全部阶段';
function scopedProblems() {
  return state.problems.filter(p => state.stage === 'all' || stageOf(p) === state.stage);
}
function switchStage(stage) {
  if (stage !== 'all' && !STAGES.some(s => s.id === stage)) return;
  setState({stage, expandedId:null, query:''});
}
function stageBadge(p) {
  return state.stage === 'all'
    ? `<div class="note-text">📚 ${stageName(stageOf(p))}</div>` : '';
}

const SUBJECTS = [
  { name:'高数', color:'#D4836A', bg:'#FBF0EB' },
  { name:'线代', color:'#3A7CA5', bg:'#ECF3F8' },
  { name:'概率论', color:'#4A8C5C', bg:'#EDF5EF' },
  { name:'811信号', color:'#C48A2A', bg:'#FDF5EA' },
  { name:'英语', color:'#7B5EA7', bg:'#F3EEF9' },
  { name:'政治', color:'#C47A7A', bg:'#F9F0F0' },
  { name:'其他', color:'#7F8C8D', bg:'#F0F2F2' },
];

const ERROR_TYPES = [
  { id:'concept', label:'概念不清', emoji:'🧠' },
  { id:'method', label:'方法不会', emoji:'🔧' },
  { id:'calc', label:'计算失误', emoji:'🔢' },
  { id:'careless', label:'粗心大意', emoji:'😵' },
];

/* ── Utilities ── */
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const toDateStr = d => { const x=new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const addDays = (s,n) => { const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return toDateStr(d); };
const isDue = s => s <= todayStr();
const daysFrom = s => { const a=new Date(todayStr()+'T00:00:00'),b=new Date(s+'T00:00:00'); return Math.round((b-a)/864e5); };
const friendlyDate = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const getSub = name => SUBJECTS.find(s=>s.name===name) || SUBJECTS[6];
const getErr = id => ERROR_TYPES.find(e=>e.id===id);

const buildReviews = dateAdded => INTERVALS.map((days,i) => ({
  id: uid(), round: i+1, days, label: INTERVAL_LABELS[i],
  scheduledDate: addDays(dateAdded, days), done: false, correct: false,
}));

/* ── Migration ── */
function migrateProblems(problems) {
  if (!Array.isArray(problems)) return [];
  return problems.map(p => {
    if (!p.reviews || p.reviews.length < 3) {
      return { ...p, reviews: buildReviews(p.dateAdded) };
    }
    return {
      ...p,
      reviews: INTERVALS.map((days, i) => {
        const old = p.reviews[i];
        const baseScheduled = addDays(p.dateAdded, days);
        const oldScheduled = old && /^\d{4}-\d{2}-\d{2}$/.test(old.scheduledDate || '')
          ? old.scheduledDate : '';
        if (old && old.done) {
          // Keep completed history exactly as it happened.
          return { ...old, days, label: INTERVAL_LABELS[i], scheduledDate: oldScheduled || baseScheduled };
        }
        return {
          ...(old || {}),
          id: old ? old.id : uid(),
          round: i + 1,
          days,
          label: INTERVAL_LABELS[i],
          // Upgrade the old 3/7/15 schedule, but never erase a later
          // date that was already created by a failed/late review.
          scheduledDate: oldScheduled > baseScheduled ? oldScheduled : baseScheduled,
          done: false,
          correct: false,
        };
      })
    };
  });
}

/* ── Embedded data (fallback if localStorage empty) ── */
const EMBEDDED_DATA = [];

/* ── Storage ── */
function loadData() {
  try {
    const newRaw = localStorage.getItem(STORAGE_KEY);
    if (newRaw) {
      const parsed = JSON.parse(newRaw);
      if (parsed && parsed._v >= 2) return upgradeProblems(parsed.problems || []);
      return upgradeProblems(migrateProblems(Array.isArray(parsed) ? parsed : []));
    }
    const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
    if (oldRaw) {
      const parsed = JSON.parse(oldRaw);
      const migrated = upgradeProblems(migrateProblems(Array.isArray(parsed) ? parsed : []));
      saveData(migrated);
      return migrated;
    }
    if (EMBEDDED_DATA && EMBEDDED_DATA.length > 0) {
      const migrated = upgradeProblems(migrateProblems(EMBEDDED_DATA));
      saveData(migrated);
      return migrated;
    }
    return [];
  } catch(e) { console.error(e); return []; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ _v: 4, problems: data }));
}

const UNDO_KEY = STORAGE_KEY + '_undo';
function upgradeProblems(list) {
  return list.map(p => ({...p, stage:stageOf(p), history: Array.isArray(p.history) ? p.history :
    (p.reviews || []).filter(r => r.done).map(r => ({
      id:uid(), date:r.completedDate || r.scheduledDate, round:r.round,
      result:r.correct ? 'correct' : 'incorrect', legacy:true,
      estimatedDate:!r.completedDate
    }))}));
}
function commitData(data) {
  try {
    localStorage.setItem(UNDO_KEY, JSON.stringify({problems:state.problems}));
    saveData(data);
  } catch(e) { flash('保存失败，请先导出备份并检查浏览器存储'); return false; }
  return true;
}
function undoLast() {
  try {
    const raw = localStorage.getItem(UNDO_KEY);
    if (!raw) return flash('没有可撤销的操作');
    const list = JSON.parse(raw).problems;
    if (!Array.isArray(list)) throw Error('invalid undo');
    const data = upgradeProblems(list);
    saveData(data);
    localStorage.removeItem(UNDO_KEY);
    setState({problems:data, expandedId:null});
    flash('已撤销上一次数据操作');
  } catch(e) { flash('撤销失败，原记录未被清空'); }
}
function historyHTML(p) {
  const history = p.history || [];
  return `<details style="margin-top:10px" onclick="event.stopPropagation()"><summary>复习历史（${history.length}）</summary>` +
    (history.length ? [...history].reverse().map(h => `<div class="note-text">${esc(h.date)} · ${h.round ? '第'+h.round+'轮 · ' : ''}${({correct:'独立做对',incorrect:'做错，继续复习',calculation:'思路正确，但计算出错（次日补做）',restart:'重新加入复习',edit:'修改题目',master:'手动标记熟悉'})[h.result] || '更新'}${h.calculationRetry && h.result==='correct' ? '（计算补做通过）' : ''}${h.legacy ? '（旧记录'+(h.estimatedDate?'，日期为原计划日期':'')+'）' : ''}</div>`).join('') : '<div class="note-text">尚无记录；旧版未保存的失败记录无法还原。</div>') + '</details>';
}
function selectItems(items, problemOf, dateOf) {
  const q = state.query.trim().toLowerCase();
  return items.filter(x => {
    const p=problemOf(x);
    return !q || [p.problemId,p.subject,p.notes,getErr(p.errorType)?.label].join(' ').toLowerCase().includes(q);
  }).sort((a,b) => {
    const cmp = dateOf(a).localeCompare(dateOf(b));
    return (state.sortOrder === 'desc' ? -cmp : cmp) || problemOf(a).id.localeCompare(problemOf(b).id);
  });
}
function updateQuery(input, event) {
  state.query=input.value;
  // Keep the live input connected, especially while a mobile IME is composing.
  if (event?.isComposing || input.dataset.composing === 'true') return;
  render(true);
}
function getTomorrow() {
  const day=addDays(todayStr(),1);
  return scopedProblems().filter(p=>!p.mastered).flatMap(p=>{
    const r=p.reviews.find(r=>!r.done);
    return r && r.scheduledDate===day ? [{problem:p,review:r}] : [];
  });
}

/* ── App State ── */
let state = {
  problems: loadData(),
  stage: 'intensive', fStage: 'intensive',
  query: '', sortOrder: 'asc',
  tab: 'today',
  showForm: false,
  editId: null,
  expandedId: null,
  toast: '',
  fSubject: '高数',
  fProblem: '',
  fNotes: '',
  fErrorType: '',
  fDate: todayStr(),
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function flash(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = ''; render(); }, 1800);
}

/* ── Actions ── */
function openAdd() {
  setState({ showForm:true, editId:null, fStage:state.stage === 'all' ? 'intensive' : state.stage, fSubject:'高数', fProblem:'', fNotes:'', fErrorType:'', fDate:todayStr() });
}

function openEdit(p) {
  setState({ showForm:true, editId:p.id, fStage:stageOf(p), fSubject:p.subject, fProblem:p.problemId, fNotes:p.notes||'', fErrorType:p.errorType||'', fDate:p.dateAdded });
}

function submitForm() {
  if (!state.fProblem.trim()) return;
  if (!STAGES.some(s => s.id === state.fStage)) return flash('请选择所属阶段');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(state.fDate)) return flash('请选择有效日期');
  const data = [...state.problems];
  if (state.editId) {
    const idx = data.findIndex(p=>p.id===state.editId);
    if (idx>=0) {
      const old = data[idx];
      const dateChanged = old.dateAdded !== state.fDate;
      data[idx] = { ...old, stage:state.fStage, subject:state.fSubject, problemId:state.fProblem.trim(),
        notes:state.fNotes.trim(), errorType:state.fErrorType, dateAdded:state.fDate,
        reviews: dateChanged ? buildReviews(state.fDate) : old.reviews,
        history:[...(old.history||[]), {id:uid(),date:todayStr(),result:'edit'}] };
    }

  } else {
    data.unshift({
      id:uid(), stage:state.fStage, subject:state.fSubject, problemId:state.fProblem.trim(),
      notes:state.fNotes.trim(), errorType:state.fErrorType, dateAdded:state.fDate,
      history:[], reviews:buildReviews(state.fDate), mastered:false, createdAt:new Date().toISOString(),
    });

  }
  if (!commitData(data)) return;
  setState({ problems:data, showForm:false, stage:state.stage === 'all' ? 'all' : state.fStage });
  flash('已保存 ✓');
}

function completeReview(pid, rid, result) {
  if (![true, false, 'calculation'].includes(result)) return;
  const correct = result === true;
  const calculation = result === 'calculation';
  let changed = false;
  const data = state.problems.map(p => {
    if (p.id !== pid) return p;
    const rIdx = p.reviews.findIndex(r => r.id === rid);
    if (rIdx < 0 || p.mastered || p.reviews[rIdx].done || !isDue(p.reviews[rIdx].scheduledDate) || p.reviews.slice(0,rIdx).some(r=>!r.done)) return p;

    changed = true;
    const newReviews = p.reviews.map(r => ({...r}));
    const today = todayStr();

    if (correct) {
      newReviews[rIdx] = {
        ...newReviews[rIdx], done:true, correct:true, completedDate:today, calculationRetry:false
      };
    } else {
      // A calculation slip retries tomorrow without passing or restarting the round.
      newReviews[rIdx] = {
        ...newReviews[rIdx], scheduledDate:addDays(today, calculation ? 1 : 3),
        done:false, correct:false, calculationRetry:calculation
      };
    }

    // Keep every unfinished later round at the intended distance from the
    // actual completion/retry date, so overdue rounds cannot pile up today.
    for (let i = rIdx + 1; i < newReviews.length; i++) {
      if (newReviews[i].done) continue;
      const prevDate = newReviews[i-1].done ? newReviews[i-1].completedDate || newReviews[i-1].scheduledDate : newReviews[i-1].scheduledDate;
      const minDate = addDays(prevDate, INTER_GAPS[i]);
      if (newReviews[i].scheduledDate < minDate) {
        newReviews[i].scheduledDate = minDate;
      }
    }

    const history=[...(p.history||[]), {id:uid(),date:today,round:newReviews[rIdx].round,
      result:calculation?'calculation':correct?'correct':'incorrect',
      calculationRetry:!!p.reviews[rIdx].calculationRetry,
      errorType:p.errorType,scheduledDate:p.reviews[rIdx].scheduledDate}];
    const mastered=correct && (p.errorType==='calc' || newReviews.every(r=>r.done && r.correct));
    return { ...p, reviews: newReviews, history, mastered, masteredDate:mastered?today:null };
  });
  if (!changed || !commitData(data)) return;
  setState({ problems:data });
  flash(calculation ? '已安排明天补做，做对后通过本轮，原错因和历史保留' : correct ? (data.find(p=>p.id===pid)?.mastered ? '✓ 复习完成，已移至已熟悉' : '✓ 做对了，继续保持！') : '本轮3天后再试，之前记录保留');
}

function toggleMastered(id) {
  const data = state.problems.map(p => {
    if(p.id!==id) return p;
    const restart=p.mastered;
    return {...p, mastered:!restart,masteredDate:restart?null:todayStr(),
      reviews:restart?buildReviews(todayStr()):p.reviews,
      history:[...(p.history||[]),{id:uid(),date:todayStr(),result:restart?'restart':'master'}]};
  });
  if (!commitData(data)) return;
  setState({ problems:data, expandedId:null });
  flash(data.find(p=>p.id===id).mastered ? '已移至已熟悉 ✓' : '已移回复习队列');
}

function deleteProblem(id) {
  if (!confirm('确定删除这道题？')) return;
  const data = state.problems.filter(p=>p.id!==id);
  if (!commitData(data)) return;
  setState({ problems:data, expandedId:null });
  flash('已删除');
}

/* ── Export / Import ── */
function exportData() {
  const payload = {
    version: 5,
    exportedAt: new Date().toISOString(),
    problems: state.problems,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `kaoyan-review-backup-${todayStr()}.json`;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash('JSON 备份文件已导出 ✓');
}

async function importDataFile(event) {
  const input = event.target;
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const list = Array.isArray(parsed) ? parsed : parsed && parsed.problems;
    if (!Array.isArray(list) || !list.every(p => p && typeof p === 'object' && typeof p.dateAdded === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(p.dateAdded) && typeof p.id === 'string' && /^[a-zA-Z0-9_-]+$/.test(p.id) && typeof p.problemId === 'string' && typeof p.subject === 'string' && (!p.notes || typeof p.notes === 'string') && Array.isArray(p.reviews) && p.reviews.length===3 && p.reviews.every(r=>r && typeof r.id==='string' && /^[a-zA-Z0-9_-]+$/.test(r.id) && typeof r.scheduledDate==='string' && /^\d{4}-\d{2}-\d{2}$/.test(r.scheduledDate)))) {
      throw new Error('invalid backup');
    }
    const data = upgradeProblems(parsed && parsed.version >= 3 ? list : migrateProblems(list));
    if (!confirm(`将用文件中的 ${data.length} 条记录替换基础和强化两个阶段的全部 ${state.problems.length} 条记录。无阶段信息的旧题归入基础阶段。确定吗？`)) return;
    if (!commitData(data)) return;
    setState({ problems:data });
    flash(`导入成功，共 ${data.length} 条记录 ✓`);
  } catch(e) {
    console.error(e);
    flash('文件格式错误，请选择有效的 JSON 备份');
  } finally {
    input.value = '';
  }
}

function clearAllData() {
  if (!confirm('确定清空基础和强化两个阶段的所有题目及复习记录？请先下载备份。')) return;
  if (!commitData([])) return;
  setState({ problems:[] });
  flash('已清空所有数据');
}

/* ── Derived (with sequential enforcement) ── */
function getDue() {
  const res = [];
  scopedProblems().forEach(p => {
    if (p.mastered) return;
    p.reviews.forEach((r, i) => {
      if (r.done) return;
      if (!isDue(r.scheduledDate)) return;
      // Sequential: all previous rounds must be done
      const prevDone = p.reviews.slice(0, i).every(pr => pr.done);
      if (!prevDone) return;
      res.push({ problem:p, review:r });
    });
  });
  res.sort((a,b) => a.review.scheduledDate.localeCompare(b.review.scheduledDate));
  return res;
}

function getUpcoming() {
  const res = [];
  scopedProblems().forEach(p => {
    if (p.mastered) return;
    p.reviews.forEach((r, i) => {
      if (r.done) return;
      if (isDue(r.scheduledDate)) return;
      if (daysFrom(r.scheduledDate) > 14) return;
      // Sequential: all previous rounds must be done
      const prevDone = p.reviews.slice(0, i).every(pr => pr.done);
      if (!prevDone) return;
      res.push({ problem:p, review:r, diff:daysFrom(r.scheduledDate) });
    });
  });
  res.sort((a,b) => a.diff - b.diff);
  return res.slice(0, 8);
}

function getActive() {
  return scopedProblems().filter(p=>!p.mastered).sort((a,b)=>b.dateAdded.localeCompare(a.dateAdded));
}
function getMastered() {
  return scopedProblems().filter(p=>p.mastered).sort((a,b)=>(b.masteredDate||b.dateAdded).localeCompare(a.masteredDate||a.dateAdded));
}

        <div class="form-group">
          <div class="note-text">计算错误：3天后独立完整重做，做对一次即可完成；又错则3天后再试。反复计算失误可改为其他错因，恢复普通复习。</div>
          <div class="form-label">做题日期</div>
          <input type="date" class="form-input" value="${state.fDate}" onchange="setState({fDate:this.value})">
          <div class="preview-text">${state.fErrorType==='calc'?'计算错误只需首次独立做对；下列后续轮次不再要求。<br>':''}复习安排：${friendlyDate(addDays(state.fDate,3))}（3天后）· ${friendlyDate(addDays(state.fDate,10))}（10天后）· ${friendlyDate(addDays(state.fDate,25))}（25天后）</div>
        </div>
        <button class="submit-btn" onclick="submitForm()">${isEdit?'保存修改':'✓ 录入'}</button>
      </div>
    </div>`;
  }

  // Only replace results while typing. Never detach/refocus the search input:
  // doing so cancels iOS keyboard composition and can trigger focus rerenders.
  const search = document.getElementById('search');
  if ((resultsOnly || document.activeElement === search) && search && !state.showForm && app.dataset.tab === state.tab && app.dataset.stage === state.stage && state.tab !== 'data') {
    const template = document.createElement('template');
    template.innerHTML = html;
    document.getElementById('list-results').innerHTML = template.content.querySelector('#list-results').innerHTML;
    app.querySelector('.tab-bar').innerHTML = template.content.querySelector('.tab-bar').innerHTML;
    app.querySelector('.header').innerHTML = template.content.querySelector('.header').innerHTML;
    app.querySelector('.toast')?.remove();
    const toast = template.content.querySelector('.toast');
    if (toast) app.prepend(toast);
    return;
  }
  app.dataset.tab = state.tab;
  app.dataset.stage = state.stage;
  app.innerHTML = html;

  if (state.showForm) {
    const inp = document.getElementById('f-problem');
    if (inp && !state.editId) setTimeout(() => inp.focus(), 100);
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && !state.showForm) render(); });
window.addEventListener('focus', () => { if (!state.showForm) render(); });
render();
</script>
</body>
</html>
